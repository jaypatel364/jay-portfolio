name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      # Lock file must be generated with npm 10 (not npm 11) — see packageManager in package.json
      - name: Install dependencies
        run: npm ci

      # Next 15 still pulls postcss/sharp highs; do not `audit fix --force` onto Next 16.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder-key' }}
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder-key' }}
          NEXT_PUBLIC_SITE_URL: https://example.com
